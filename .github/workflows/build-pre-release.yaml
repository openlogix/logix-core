# Builds logix-core for every platform and publishes it as a GitHub
# pre-release tagged with the date (yyyy-mm-dd). A pre-release with the
# same tag is replaced, so the day's pre-release is from its latest commit;
# a stable release with that tag is never touched (the run fails instead).
#
# Runs on every push to main, daily and manually, like every Open Logix
# pre-release build. Old pre-releases are deleted by the shared policy;
# the engine's prod remote config names only stable releases (pre-release
# unticked), which are never deleted.
#
# The shared parts are Open Logix actions in openlogix/.github (tested
# there): start-pre-release, read-build-info and publish-pre-release, which
# also writes the standard release text and applies the pre-release policy.

name: build-pre-release

on:
  # Every commit to main.
  push:
    branches: [main]

  # Daily at UTC midnight, so breakage from GitHub's runners or upstream
  # changes shows up even when nothing here changes.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual activations.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pre-release
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package-tag: ${{ steps.start.outputs.package-tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      # The build details go in BUILD-INFO.json, beside the packages, not
      # inside them: the packages stay reproducible.
      - name: Start the pre-release
        id: start
        uses: openlogix/.github/actions/start-pre-release@main
        with:
          package-name: logix-core
          description: The FPGA tools Logix Engine downloads and runs. Not for use on its own; its content may change at any time.

  # wdi-simple, the WinUSB driver installer Logix Engine runs on Windows:
  # libwdi publishes no build of it, so it's built here from the pinned
  # libwdi source, unmodified (scripts/build-wdi-simple.sh), on Windows with
  # MSYS2. Cached by its pin and the script, so it's built again only when
  # either changes and the Windows core keeps its bytes from day to day.
  build-wdi-simple:
    runs-on: windows-2025
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Compute the cache key
        id: key
        shell: bash
        run: |
          pin="$(python -c 'import json; print(json.dumps(json.load(open("pins.json"))["components"]["wdi-simple"], sort_keys=True))')"
          hash="$( { echo "$pin"; cat scripts/build-wdi-simple.sh; } | sha256sum | cut -c1-32)"
          echo "key=wdi-simple-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the built zip
        id: cache
        uses: actions/cache@v6
        with:
          path: _wdi
          key: ${{ steps.key.outputs.key }}

      - name: Set up MSYS2
        if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            git
            curl
            zip
            jq

      # libwdi v1.5.1's own code gives three compiler warnings, all unused
      # variables (libwdi.c is_64bit; zadig.c is_64bit and zadig_net.c
      # archname, from Zadig, which libwdi's build compiles with the
      # examples). Accepted under Strict CI's upstream-warnings door (the
      # website repo's CLAUDE.md): upstream's build shows them too, they're
      # harmless, and we build libwdi unmodified.
      - name: Build wdi-simple
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-wdi-simple.sh _wdi

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: wdi-simple
          path: _wdi/*.zip

  # Logix Viewer, Open Logix's own program (apps/viewer): built on each
  # platform's own runner (macOS for the .app bundles and their ad-hoc
  # signature), by scripts/build-viewer.sh. Cached by its sources and the
  # script, so it's built again only when they change and the core keeps
  # its bytes from day to day.
  build-viewer:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: linux-x86-64
            runner: ubuntu-22.04
          - platform: windows-x86-64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Compute the cache key
        id: key
        run: |
          hash="$("$(command -v python3 || command -v python)" -c 'import hashlib, subprocess; files = sorted(subprocess.check_output(["git", "ls-files", "apps/viewer", "scripts/build-viewer.sh"], text=True).split()); h = hashlib.sha256(); [h.update(f.encode() + open(f, "rb").read()) for f in files]; print(h.hexdigest()[:32])')"
          echo "key=logix-viewer-${{ matrix.platform }}-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the built package
        id: cache
        uses: actions/cache@v6
        with:
          path: _viewer
          key: ${{ steps.key.outputs.key }}

      # What wry and tao need to build on Linux: WebKitGTK and GTK. Not
      # libxdo: the viewer must not need it (apps/viewer/Cargo.toml), and
      # without its -dev package here, a build that links it fails.
      - name: Install the Linux build libraries
        if: steps.cache.outputs.cache-hit != 'true' && matrix.platform == 'linux-x86-64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # Its tests, format and lint (warnings are errors), when its sources
      # changed.
      - name: Check Logix Viewer
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: apps/viewer
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build Logix Viewer
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-viewer.sh ${{ matrix.platform }} _viewer

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: logix-viewer-${{ matrix.platform }}
          path: _viewer/*.tgz

  # One job per platform. Packing needs no platform of its own: the files
  # are only downloaded, unpacked and packed again (and wdi-simple, built
  # above, put in the Windows downloads first).
  build:
    needs: [prepare, build-wdi-simple, build-viewer]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [darwin-arm64, linux-x86-64, windows-x86-64]
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the build's Python packages
        run: pip install -r requirements.txt

      - name: Get wdi-simple
        if: matrix.platform == 'windows-x86-64'
        uses: actions/download-artifact@v8
        with:
          name: wdi-simple
          path: ${{ runner.temp }}/work/downloads/windows-x86-64

      - name: Get Logix Viewer
        uses: actions/download-artifact@v8
        with:
          name: logix-viewer-${{ matrix.platform }}
          path: ${{ runner.temp }}/work/downloads/${{ matrix.platform }}

      - name: Build logix-core for ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build.py \
              --platform ${{ matrix.platform }} \
              --package-tag ${{ needs.prepare.outputs.package-tag }} \
              --out _out --work "$RUNNER_TEMP/work"
          ls -l _out

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: logix-core-${{ matrix.platform }}
          path: _out/*
          compression-level: 0

  pre-release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Read the build info
        uses: openlogix/.github/actions/read-build-info@main

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: logix-core-*
          merge-multiple: true
          path: _artifacts

      # Every package a CI build publishes is scanned (the website repo's
      # CLAUDE.md, Shared CI): the upstream tools inside included.
      - name: Scan the packages for viruses
        uses: openlogix/.github/actions/scan-files-for-viruses@main
        with:
          file-patterns: |
            _artifacts/logix-core-*.tgz

      - name: Write the release content
        run: |
          cat > CONTENT.md <<EOF
          Each package holds the pinned upstream releases, unchanged, one folder each (see \`logix-core.json\` inside, and [pins.json](https://github.com/${REPO}/blob/${REPO_COMMIT}/pins.json)). The Windows package also holds libwdi's wdi-simple, which upstream publishes no build of: it's built here from the pinned libwdi source, unmodified. Every package also holds logix-viewer, Open Logix's own Logix Viewer, built here from this repo's apps/viewer.
          EOF

      - name: Publish the pre-release
        uses: openlogix/.github/actions/publish-pre-release@main
        with:
          title: "logix-core: The FPGA tools Logix Engine downloads and runs."
          engine-note: core
          content-file: CONTENT.md
          about-bullets: The engine's prod remote config names only stable releases, which are never deleted.
          files: |
            _artifacts/logix-core-darwin-arm64-${{ env.PACKAGE_TAG }}.tgz
            _artifacts/logix-core-linux-x86-64-${{ env.PACKAGE_TAG }}.tgz
            _artifacts/logix-core-windows-x86-64-${{ env.PACKAGE_TAG }}.tgz
