[package]
name = "logix-viewer"
# Not used for releases: logix-core's release date is the version.
version = "0.0.0"
edition = "2024"
description = "Shows Logix Engine's pages (waveforms, diagrams) in windows of their own. Meant only for Logix Engine."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tao = "0.37.2"
wry = "0.57.1"
# No libxdo: it serves only predefined menu items on Linux, where the
# viewer shows no menu, and most desktops lack the library (the viewer
# didn't start on a Linux machine without it, 2026-11-23).
muda = { version = "0.20.0", default-features = false, features = ["gtk3"] }
rfd = "0.16.1"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"

# The window icon and the program's name on Linux (identity.rs): the same
# GTK tao uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Each app's own taskbar button on Windows (identity.rs): the version tao
# and wry already use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
